<div class="layout">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard">IncidentDesk</a>
    <nav aria-label="Main">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/incidents" routerLinkActive="active">Incidents</a>
      <a *appCan="['admin']" routerLink="/settings" routerLinkActive="active">Settings</a>
      <a routerLink="/status" target="_blank" rel="noopener">Public status page</a>
    </nav>
    <div class="user">
      <span class="name">{{ user()?.name }}</span>
      <span class="role">{{ user()?.role }}</span>
      <button class="btn btn-sm" type="button" (click)="logout()">Sign out</button>
    </div>
  </aside>
  <main class="content"><router-outlet /></main>
</div>
